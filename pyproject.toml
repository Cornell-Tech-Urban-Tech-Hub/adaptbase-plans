[project]
name = "adaptbase-plans-tools"
version = "0.1.0"
description = "Tools for managing adaptbase planning documents"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.10.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openai>=1.50.0",
    "tiktoken>=0.8.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "SIM", "ARG"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
